name: 24/7 Job Search & Application Engine

on:
  schedule:
    # Runs automatically every 4 hours
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Prevents two runs from racing to push the same binary files (xlsx/db) at once,
# which is what caused the "Cannot merge binary files" rebase conflict.
concurrency:
  group: job-hunter-engine
  cancel-in-progress: false

jobs:
  run-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Caches the tracker DB across runs without Git merge conflicts
      - name: Restore Application Tracking Cache
        uses: actions/cache@v4
        with:
          path: |
            job_tracker.db
            job_applications.xlsx
          key: tracker-cache-${{ github.run_id }}
          restore-keys: |
            tracker-cache-

      - name: Install Dependencies
        run: |
          pip install python-jobspy google-genai requests pandas openpyxl reportlab

      - name: Ensure Storage Directory Exists
        run: |
          mkdir -p generated_docs

      # Sync to the very latest main BEFORE generating any new files.
      # This is the key fix: previously the workflow fetched main, THEN ran the
      # pipeline, THEN committed, and only pulled/rebased at the end — by which
      # point another run may have already pushed a newer xlsx/db, causing a
      # binary merge conflict that git can't auto-resolve. Resetting first means
      # every run starts from a clean, current baseline.
      - name: Sync to Latest Main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main

      - name: Execute Pipeline & Generate PDFs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEARCH_API_KEY: ${{ secrets.SEARCH_API_KEY }}
        run: python main.py

      - name: Commit and Push Generated PDFs
        run: |
          # Stage PDFs, Excel tracker, and the SQLite tracker DB
          git add -f generated_docs/*.pdf job_applications.xlsx job_tracker.db

          if git diff --staged --quiet; then
            echo "No new documents to commit."
          else
            git commit -m "Auto-archive generated resumes, cover letters, and tracker [skip ci]"

            # Fallback safety net: if another run somehow snuck a push in during
            # this job, prefer OUR freshly generated files on conflict rather
            # than failing the whole run.
            git pull --rebase -X theirs origin main
            git push origin main
          fi
