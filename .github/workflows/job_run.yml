name: 24/7 Job Search & Application Engine

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore Application Tracking Cache
        uses: actions/cache@v4
        with:
          path: |
            job_tracker.db
            job_applications.xlsx
          key: tracker-cache-${{ github.run_id }}
          restore-keys: |
            tracker-cache-

      - name: Install Dependencies
        run: |
          pip install python-jobspy google-genai requests pandas openpyxl reportlab

      - name: Ensure Storage Directory Exists
        run: |
          mkdir -p generated_docs

      - name: Execute Pipeline & Generate PDFs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEARCH_API_KEY: ${{ secrets.SEARCH_API_KEY }}
        run: python main.py

      - name: Commit and Push Generated PDFs & Excel Tracker
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Pull latest remote changes first
          git pull origin main --rebase || true
          
          # Force-stage all PDFs, Excel tracker, and DB
          git add -f generated_docs/*.pdf job_applications.xlsx job_tracker.db
          
          if git diff --staged --quiet; then
            echo "No new documents to commit."
          else
            git commit -m "Auto-archive generated resumes, cover letters, and tracker [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
