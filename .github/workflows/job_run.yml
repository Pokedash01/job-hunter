name: 24/7 Job Search & Application Engine

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  run-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore Application Tracking Cache
        uses: actions/cache@v4
        with:
          path: |
            job_tracker.db
            job_applications.xlsx
          key: tracker-cache-${{ github.run_id }}
          restore-keys: |
            tracker-cache-

      - name: Install Dependencies
        run: |
          pip install python-jobspy google-genai requests pandas openpyxl

      - name: Execute Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEARCH_API_KEY: ${{ secrets.SEARCH_API_KEY }}
        run: python main.py

      - name: Upload Excel Tracker as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: job_applications_tracker
          path: job_applications.xlsx
