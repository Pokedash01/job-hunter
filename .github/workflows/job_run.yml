name: 24/7 Job Search & Application Engine

on:
  schedule:
    # Runs automatically every 4 hours
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Prevents two runs from racing to push at once.
concurrency:
  group: job-hunter-engine
  cancel-in-progress: false

jobs:
  run-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # job_tracker.db and job_applications.xlsx live ONLY here across runs.
      # They are intentionally .gitignore'd below and never committed to git,
      # so they can never conflict with git history (including if someone
      # deletes them from the repo on GitHub — the cache is independent of that).
      - name: Restore Application Tracking Cache
        uses: actions/cache@v4
        with:
          path: |
            job_tracker.db
            job_applications.xlsx
          key: tracker-cache-${{ github.run_id }}
          restore-keys: |
            tracker-cache-

      - name: Install Dependencies
        run: |
          pip install python-jobspy google-genai requests pandas openpyxl reportlab

      - name: Ensure Storage Directory Exists
        run: |
          mkdir -p generated_docs

      - name: Sync to Latest Main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          # reset --hard only touches TRACKED files — job_tracker.db and
          # job_applications.xlsx are untracked/ignored, so the cache-restored
          # copies above survive this step untouched.

      - name: Execute Pipeline & Generate PDFs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEARCH_API_KEY: ${{ secrets.SEARCH_API_KEY }}
        run: python main.py

      - name: Commit and Push Generated PDFs
        run: |
          # Only the PDFs are git-tracked. Each filename is unique
          # (company + role + timestamp), so this is always a pure
          # "add new file" — never a modify or delete — meaning it
          # can never produce a merge/rebase conflict.
          git add -f generated_docs/*.pdf

          if git diff --staged --quiet; then
            echo "No new documents to commit."
          else
            git commit -m "Auto-archive generated resumes & cover letters [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
